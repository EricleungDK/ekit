# TEST FIXTURE, NOT A SUPPORTED BUILT-IN, AND NOT HAND-WRITTEN: the kit's Java adapter (#25), generated by ci-doctor's
# setup mode (skills/ci-doctor/setup.md) on 2026-11-27 for a copy of tests/fixtures/java/base, with Maven 3.9.11,
# JDK 21 and PIT 1.17.4 installed and running, the agent kept from the hand-written adapter this one replaced and from
# the CI doc's notes on it. Its proof in that run: R0 static half 17 of 17, census 3 of 3, runner controls 5 of 5, the
# R3 control (weak 2 MISSED, strong 0), and a cheat list of 53 items, each caught or named under its Limits below.
# Below this block, up to the end, is the generated file byte for byte (tests/py/test_java_generated.py checks its git
# blob), and maven.r0/ beside it holds its R0 fixtures as generated: regenerate them, never edit them by hand.
# Nothing offers it: resolve, auto and --stack see the built-ins and a repo's .ekit/adapters/<name>.toml only, so it
# runs only when named:
#   mech-review.py all --stack maven --adapter tests/fixtures/adapters/maven.toml --test-paths 'src/test/**'

# mech-review adapter for this repo: Java 17, Maven (surefire 3.5.2), JUnit 5 (Jupiter), PIT 1.17.4.
# Generated by ci-doctor setup mode from the repo's pom.xml and src/test/java; proved by R0 (.ekit/adapters/maven.r0/).
#
# Limits (owner decides): cheats R2 does not catch through this file, and the run side's looseness.
# - R1/R4 run one test through surefire's regex filter with the method's first letter as a wildcard ([run] below):
#   tests whose names differ only in that letter, in one class, run together
# - [run.name] placeholders are used to build that filter, not for their documented purpose (it.each values)
# - a test method made private or static, a test class made abstract, @Nested removed from an inner class, a test
#   class renamed out of surefire's includes: modifiers and class names are not read as run/no-run
# - a composed skip (`@Disabled @interface Wip`, then `@Wip`), `@ExtendWith(<an ExecutionCondition>)`, a same-package
#   `@interface Test` shadowing an on-demand import: markers are matched by word, not resolved
# - assumeTrue/assumeFalse/assumingThat/Assumptions.abort added to a body that keeps its asserts (R4 fails it at runtime:
#   "did not run at head"), and an early `if (true) return;`
# - a trigger file for a file-activated profile already in pom.xml; @Tag under an excludedGroups already in pom.xml
#   (adding either to pom.xml is the mutation-config entry)
# - @SuppressWarnings / @SuppressFBWarnings: [[suppressions]] reads comments only
# - member-form asserts (`Assertions.assertEquals(...)`): a word after the member character is not a call; this repo
#   uses static imports
format = 1
name = "maven"
manifests = ["pom.xml"]
extensions = [".java"]
target-os = "linux"

[lexer]
block_style = "braces"
brackets = ["()", "[]", "{}"]
ident_chars = "$"
line_comments = ["//"]
block_comments = [["/*", "*/"]]
unicode_escapes = true

[[lexer.strings]]
quote = '"""'
escape = '\'
multiline = true
name = "text block"

[[lexer.strings]]
quote = '"'
escape = '\'

[[lexer.strings]]
quote = "'"
escape = '\'

[tests]
style = "declared"
prefix = "@"
cases = ["Test", "ParameterizedTest", "RepeatedTest", "TestFactory", "TestTemplate"]
groups = ["class"]
skip = [
  "Disabled",
  "DisabledOnOs", "EnabledOnOs",
  "DisabledOnJre", "EnabledOnJre", "DisabledForJreRange", "EnabledForJreRange",
  "DisabledIfEnvironmentVariable", "EnabledIfEnvironmentVariable",
  "DisabledIfEnvironmentVariables", "EnabledIfEnvironmentVariables",
  "DisabledIfSystemProperty", "EnabledIfSystemProperty",
  "DisabledIfSystemProperties", "EnabledIfSystemProperties",
  "DisabledIf", "EnabledIf",
  "DisabledInNativeImage", "EnabledInNativeImage",
]
separator = "."
skipped_text = "test `{name}` disabled (@Disabled, or a conditional @Disabled*/@Enabled* marker)"

[functions]
shapes = ["void NAME (...) ...{...}"]

[[asserts.call]]
names = ["assertEquals", "assertArrayEquals", "assertIterableEquals", "assertLinesMatch", "assertSame"]
kind = "eq"
operands = [0, 1]

[[asserts.call]]
names = ["assertNotEquals", "assertNotSame"]
kind = "ne"
operands = [0, 1]

[[asserts.call]]
names = [
  "assertTrue", "assertFalse", "assertNull", "assertNotNull", "assertInstanceOf",
  "assertThrows", "assertThrowsExactly", "assertDoesNotThrow", "assertAll",
  "assertTimeout", "assertTimeoutPreemptively", "fail",
]
kind = "other"

# PMD and Sonar: the reason is the text after the directive (`// NOPMD - why`).
[[suppressions]]
directives = ["NOPMD", "NOSONAR"]
covers = { "NOPMD" = "line", "NOSONAR" = "line" }
reason_strip = [":", "-–— "]

# IntelliJ: `//noinspection <rules> -- why` (IntelliJ has no reason syntax; `--` is this repo's convention).
[[suppressions]]
directives = ["noinspection"]
covers = { "noinspection" = "next-line" }
lints = "rules"
reason_after = "--"

# Checkstyle comment filters: OFF runs to its ON, read as the whole file.
[[suppressions]]
directives = ["CHECKSTYLE:OFF", "CHECKSTYLE.OFF", "CHECKSTYLE.SUPPRESS"]
covers = { "CHECKSTYLE:OFF" = "file", "CHECKSTYLE.OFF" = "file", "CHECKSTYLE.SUPPRESS" = "next-line" }
reason_strip = [":", "-–— "]

[mutation]
# PIT skips code under an annotation whose name ends with one of these (its default excluded annotations).
skip_annotations = ["Generated", "DoNotMutate", "CoverageIgnore"]
# What changes which tests run or what PIT mutates: the pom (surefire, profiles, PIT), Maven's own config, and
# JUnit Platform config and extension registration. A change to any is a person's call.
config_files = [
  "pom.xml", ".mvn/maven.config", ".mvn/jvm.config", ".mvn/extensions.xml",
  "junit-platform.properties", "org.junit.jupiter.api.extension.Extension",
]
config_name = "the Maven build's test or PIT config (surefire, profiles, PIT, JUnit Platform)"

[mutation.tool]
name = "pitest"
command = "mvn"
args = [
  "-B", "-ntp", "test-compile", "org.pitest:pitest-maven:mutationCoverage",
  "-DtargetClasses={mutate}", "-DoutputFormats=XML", "-DtimestampedReports=false",
  "-DreportsDirectory=target/pit-reports", "-DtimeoutConstant={timeout_ms}", "-DfailWhenNoMutations=false",
]
mutate = "{module}*"
module_roots = ["src/main/java"]
version = ["--version"]
version_pattern = "Apache Maven"
report = "target/pit-reports/mutations.xml"
format = "pit-xml"
os = ["linux", "macos", "windows"]
baseline_failed = "did not pass without mutation"

[commands]
install = ""
build = "mvn -B -ntp test-compile"
lint = ""
test = "mvn -B -ntp test"

# One test by name: surefire's regex filter `%regex[<class file regex>#<method regex>]`. [run] joins a name's parts
# with one separator, and surefire needs `Outer$Inner#method`, so the parts are joined with "." (a regex `.` matches
# `$` and `/`) and the placeholder puts `class#.` in place of the method's first letter: `CalcTest.adds` runs as
# `%regex[(.*/)?CalcTest.class#.dds]`, `CtlTest.Inner.same` as `%regex[(.*/)?CtlTest.Inner.class#.ame]`. It relies
# on Java naming (classes upper-case first, methods lower-case first); a name that breaks it reads `none` or `error`,
# never `pass`. The method's first letter is a wildcard: `adds` also runs an `odds` in the same class.
[run]
test = ["-Dtest=%regex[(.*/)?{name}]"]

[run.name]
escape = '$'
placeholders = '^[a-z]'
any = 'class#.'

[run.list]
command = "mvn -B -ntp test -Dsurefire.reportFormat=plain -Dsurefire.useFile=false -Dmaven.test.failure.ignore=true"
pattern = '^\[(?:INFO|WARNING|ERROR)\] (?P<name>[\w$.]+) -- Time elapsed'
separator = "$"

[run.outcome]
summary = '^\[(?:INFO|WARNING|ERROR)\] Tests run: (\d+, Failures: \d+, Errors: \d+, Skipped: \d+)\s*$'
passed = '^(\d+), Failures: 0, Errors: 0, Skipped: 0'
failed = '(?:Failures|Errors): (\d+)'
skipped = 'Skipped: (\d+)'
build = 'COMPILATION ERROR|Compilation failure'
no_test = 'No tests matching pattern'
env = 'JAVA_HOME (?:environment variable )?is not defined'
