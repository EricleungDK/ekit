# ekit adapter file: TypeScript / JavaScript, the R2 side (#16), the R1/R4 run side (#18) and R3 through Stryker (#19).
# It describes what the built-in `ts` adapter (scripts/mech_review/stack.py, TsAdapter) reads and runs, and R2, R1, R4
# and R3 through it give the same entries.
# Use: mech-review.py r2 --stack ts --adapter scripts/mech_review/adapters/ts.toml (or red, all, mutants, baseline, plan)
# Format: docs/mech-review-ci.md#adapter-file
format = 1
name = "ts"
manifests = ["package.json"]
extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]

[lexer]
block_style = "braces"
brackets = ["()", "[]", "{}"]
ident_chars = "$"
member = "."
line_comments = ["//"]
block_comments = [["/*", "*/"]]

# "..." and '...' end at the line end with no error (JSX text holds apostrophes)
[[lexer.strings]]
quote = '"'
escape = '\'

[[lexer.strings]]
quote = "'"
escape = '\'

[[lexer.strings]]
quote = "`"
escape = '\'
multiline = true
interpolation = ["${", "}"]
name = "template literal"

# /re/flags where an operand cannot be a division: after these characters, these words, or at the start of the file
[lexer.regex]
delimiter = "/"
after = "(,=:[!&|?{};+-*%<>~^"
after_words = ["return", "typeof", "case", "do", "else", "in", "of", "new", "delete", "void", "throw", "yield",
               "await", "instanceof"]

[tests]
style = "calls"
groups = ["describe", "xdescribe", "fdescribe"]
cases = ["it", "test", "xit", "xtest", "fit", "ftest"]
separator = " > "
skip = ["xit", "xdescribe", "xtest"]
only = ["fit", "fdescribe", "ftest"]
skip_modifiers = ["skip", "todo"]
only_modifiers = ["only"]
table_modifiers = ["each"]
min_args = 2
not_after = ["function", "function*"]
skipped_text = "test `{name}` marked skipped (skip, todo or x-prefixed)"

# named functions own the asserts in them (helpers a test calls)
[functions]
shapes = [
  "function *? NAME (...) ...{...}",
  "export? const|let|var NAME :...? = async? (...) => BODY",
  "export? const|let|var NAME :...? = async? function *? ID? (...) ...{...}",
  "export? const|let|var NAME :...? = async? ID => BODY",
]

[[asserts.chain]]
start = "expect"
negate = ["not"]
pass_through = ["resolves", "rejects"]
eq = ["toBe", "toEqual", "toStrictEqual"]

[[suppressions]]
directives = ["eslint-disable-next-line", "eslint-disable-line", "eslint-disable"]
covers = { "eslint-disable-next-line" = "next-line", "eslint-disable-line" = "line", "eslint-disable" = "file" }
lints = "rules"
reason_after = "--"
problem = "`{lints}` added without a reason"
hint = "fix the lint, or give the suppression a reason after the rules: `// {lints} -- why`"

[[suppressions]]
directives = ["@ts-ignore", "@ts-expect-error", "@ts-nocheck"]
covers = { "@ts-ignore" = "next-line", "@ts-expect-error" = "next-line", "@ts-nocheck" = "file" }
lints = "directive"
reason_strip = [":", "-–— "]
problem = "`{lints}` added without a reason"
hint = "fix the type error, or give the directive a reason after it: `// {lints}: why`"

[mutation]
skip_comments = ["Stryker disable"]
config_name = "Stryker config"
config_files = [
  "stryker.conf.js", "stryker.conf.mjs", "stryker.conf.cjs", "stryker.conf.ts", "stryker.conf.mts", "stryker.conf.cts",
  "stryker.conf.json",
  "stryker.config.js", "stryker.config.mjs", "stryker.config.cjs", "stryker.config.ts", "stryker.config.mts",
  "stryker.config.cts", "stryker.config.json",
  ".stryker.conf.js", ".stryker.conf.mjs", ".stryker.conf.cjs", ".stryker.conf.ts", ".stryker.conf.mts",
  ".stryker.conf.cts", ".stryker.conf.json",
  ".stryker.config.js", ".stryker.config.mjs", ".stryker.config.cjs", ".stryker.config.ts", ".stryker.config.mts",
  ".stryker.config.cts", ".stryker.config.json",
]

# R3 (#19): Stryker 10.0.0 on the changed lines (`--mutate file:a-b` per run of changed lines), its JSON reporter's file
# read as mutation-testing-elements. The program is `stryker` on PATH, never the checkout's node_modules (the PR under
# review could supply it); the workflow passes --mutants-cmd (its own pinned install, outside the checkout).
[mutation.tool]
name = "stryker"
command = "stryker"
version = ["--version"]
version_pattern = '^\d+\.\d+\.\d+$'
args = ["run", "--mutate", "{mutate}", "--reporters", "json", "--allowConsoleColors", "false", "--timeoutMS", "{timeout_ms}"]
mutate = "{file}:{first}-{last}"
mutate_join = ","
report = "reports/mutation/mutation.json"
format = "mutation-testing-elements"
os = ["linux", "macos", "windows"]
timeout = 120
baseline_failed = 'There were failed tests in the initial test run'

# vitest with no repo Stryker config: the command runner runs the suite per mutant (the vitest plugin of Stryker 10.0.0
# completes no test nested in describe on vitest 5), per-test coverage off
[mutation.tool.runners.vitest]
needs = "node_modules/.bin/vitest"
config_file = "stryker.conf.json"
config = '''
{
  "testRunner": "command",
  "commandRunner": {
    "command": "npx --no-install vitest run"
  },
  "coverageAnalysis": "off",
  "checkers": [],
  "reporters": [
    "json"
  ],
  "thresholds": {
    "break": null
  }
}'''

# jest with no repo Stryker config: Stryker's jest plugin
[mutation.tool.runners.jest]
needs = "node_modules/.bin/jest"
args = ["--testRunner", "jest"]

# the stack's commands: ci-doctor writes base CI jobs from them; R1 and R4 start from test ("" = the stack has none)
[commands]
install = "npm ci"
build = ""  # vitest and jest transform the sources themselves: no build step before the tests
lint = ""
test = "node_modules/.bin/vitest run"

# one named test: the file, then -t with the anchored name (both runners match -t as a regex on the full name)
[run]
test = ["{path}", "-t", "^{name}$"]
links = ["node_modules"]  # a worktree has no node_modules (ignored by git): the caller checkout's is linked in

# a name part as a regex: these characters literal; it.each's `%s`-style and `$var` placeholders match any value
[run.name]
escape = '\^$.|?*+()[]{}/'
placeholders = '%[sdifjoOp#%]|\$\w+'
any = ".*"

# jest: a command naming jest, or package.json listing jest and not vitest; it joins describe and test with a space
[[run.runner]]
name = "jest"
match = "jest"
command = "node_modules/.bin/jest"
when = { file = "package.json", tables = ["dependencies", "devDependencies"], has = ["jest"], lacks = ["vitest"] }
separator = " "

# vitest: any other command; `run` is put in after the vitest word when missing (else at the end). Its -t matches the
# full name with describe and test joined by a space (vitest 2.1.9, 3.2.7), as jest's does
[[run.runner]]
name = "vitest"
subcommand = { word = "run", after = "vitest" }
separator = " "

# R0's census (#21): `vitest list` prints `<file> > <Describe> > <test>` per test it collects (skipped ones are not
# listed); jest lists files only, so a jest checkout has no census
[run.list]
command = "node_modules/.bin/vitest list"
pattern = '^(?P<file>\S+\.[cm]?[jt]sx?) > (?P<name>.+?)\s*$'
separator = " > "
runner = "vitest"

# the counts come from the last `Tests` summary line of a vitest or jest run; a file that did not load is build
[run.outcome]
summary = '^\s*Tests\b:?(.*)$'
passed = '(\d+) passed\b'
failed = '(\d+) failed\b'
build = 'Transform failed|Failed to load url|Failed to resolve import|Cannot find module|Cannot find package|Test suite failed to run|SyntaxError|\bTS\d{4}\b|Failed Suites'
