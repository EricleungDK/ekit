name: mech-review

# Reusable. Callers follow the major tag, which each release moves (release.yml):
#   uses: EricleungDK/ekit/.github/workflows/mech-review.yml@v0
# The ekit scripts run at the SAME ref the caller called: job.workflow_sha / job.workflow_repository
# are the called workflow file's commit and repo, so the guard, red-first, mutants and the poster are checked out from there.

on:
  workflow_call:
    inputs:
      stack:
        description: "language adapter: auto (the one project found from the tracked manifests at base and head; several, none, or a PR that changes it fails and asks for stack and project-dir), rust (cargo test, cargo-mutants), python (pytest, mutmut 3.8.1 in a venv) or ts (vitest or jest from package.json, Stryker 10.0.0; node 22)"
        type: string
        default: auto
      test-paths:
        description: "test file globs, one per line (** any depth, * one segment)"
        type: string
        default: |
          tests/**
      protected-paths:
        description: "globs, one per line; any change under them is a needs-human fail"
        type: string
        default: |
          .github/**
      agent-branch-prefix:
        description: "R1 red-first runs only on head branches that start with one of these prefixes, one per line (* = every branch)"
        type: string
        default: |
          agent/
          claude/
          codex/
          copilot/
          cursor/
      mutation-budget:
        description: "R3 budget in minutes per mutants shard, and for the baseline step (rust: cargo-mutants' baseline; python: the suite run and mutmut's listing, each within it, so up to about twice it); a budget hit is partial, not a failure; a baseline that does not finish in it is n/a (rust) or keeps one shard per changed file (python)"
        type: string
        default: "10"
      max-mutants:
        description: "R3 cap: the most mutants tested per PR, riskiest first (branch conditions, then returns and boolean literals, then arithmetic, then the rest, string and argument mutants last); the rest are untested and R3 reads partial (tested/total). rust and python by mutant; ts by changed lines, riskiest first, counted by Stryker's own instrumenter before the run"
        type: string
        default: "40"
      extra-apt-packages:
        description: "apt packages (space-separated) installed in red-first, mutants and (rust, python) baseline, before the tests run; Linux runners only"
        type: string
        default: ""
      project-dir:
        description: "crate dir under the repo root (default .; with stack auto, the dir found): R1, R4 and R3 run there; test-paths and protected-paths stay repo-root globs. A dir you set is never replaced"
        type: string
        default: "."
      setup-command:
        description: "shell command (run with bash) before the tests in red-first, mutants and (rust, python) baseline, after extra-apt-packages; a failure stops that job. Set it in the caller's workflow file only (trusted)"
        type: string
        default: ""
      mutant-timeout:
        description: "R3 per-mutant timeout in seconds, or empty for the timeout derived from the measured baseline (5x its test time, at least 20 s: cargo-mutants' rule). A set value is used as is. Neither caps the baseline: it runs once, in the baseline job, bounded by mutation-budget"
        type: string
        default: ""
      rust-toolchain:
        description: "Rust toolchain for the rust stack in red-first and mutants (dtolnay/rust-toolchain toolchain input): stable, or a pin such as 1.96.0"
        type: string
        default: "stable"

permissions:
  contents: read
  pull-requests: write

jobs:
  stack:
    name: mech-review stack (auto)
    runs-on: ubuntu-latest
    # git only, no PR code: settles stack and project-dir once. Every later job reads them from these outputs, through
    # env or an if: condition, never interpolated into a run: line (the values come from the PR's tree).
    outputs:
      stack: ${{ steps.resolve.outputs.stack }}
      project-dir: ${{ steps.resolve.outputs.project-dir }}
      error: ${{ steps.resolve.outputs.error }}
      target-os: ${{ steps.resolve.outputs.target-os }}
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ekit engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ekit
          persist-credentials: false
      - name: resolve stack and project-dir
        id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ inputs.stack }}
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          set -uo pipefail
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" resolve --repo "$GITHUB_WORKSPACE/caller" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK" --project-dir "$PROJECT_DIR" > stack.json || rc=$?
          # exit 1 = no stack (the error is the result, reported by the report job). exit 2+ = usage or git error.
          if [ "$rc" -gt 1 ]; then
            echo "::error::mech-review resolve exit $rc (usage or git error): no stack"
            exit "$rc"
          fi
          python3 -I - "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          r = json.load(open("stack.json"))
          error = r["error"] or ""
          stacks = r.get("stacks") or []  # #17: a plan with several stacks to run; one set of checks per stack is not
          if len(stacks) > 1 and not error:  # wired yet (the report merges one stack's results), so stop, named
              found = ", ".join(f"{s['name']}: {s['stack']} in {s['project_dir']}" for s in stacks)
              error = (f"stack auto: the stack plan has several stacks to run ({found}); this workflow runs one stack: "
                       "set the stack and project-dir inputs to the one to check")
          values = {"stack": r["stack"] or "", "project-dir": r["project_dir"], "error": error,
                    "target-os": r.get("target_os") or ""}
          assert not any(c in v for v in values.values() for c in "\r\n"), values  # one line each: an output per line
          with open(sys.argv[1], "a") as out:
              for k, v in values.items():
                  out.write(f"{k}={v}\n")
          PY
      - name: no stack (set stack and project-dir)
        if: steps.resolve.outputs.error != ''
        env:
          ERROR: ${{ steps.resolve.outputs.error }}
        run: |
          echo "::error::$ERROR"
          exit 1

  guard:
    name: mech-review guard (R2)
    needs: [stack]
    runs-on: ubuntu-latest
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ekit engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ekit
          persist-credentials: false
      - name: drift check (stack plan, D)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" drift --repo "$GITHUB_WORKSPACE/caller" \
            --base "$BASE_SHA" --head "$HEAD_SHA" > mech-review-drift.json 2> mech-review-drift.err || rc=$?
          cat mech-review-drift.err >&2
          # exit 0 clean, messages only or no plan (no D in it), 1 the fail entry, 2 with a result (a bad plan: D fails
          # with a CI entry): kept. Nothing on stdout (a git error, a crash): no result, and the job stops here, before
          # R2, so the report fails on R2's missing result
          [ -s mech-review-drift.json ] || rm -f mech-review-drift.json
          if [ ! -f mech-review-drift.json ]; then
            echo "::error::mech-review drift exit $rc: no result"
            exit "$(( rc > 0 ? rc : 2 ))"
          fi
          if [ "$rc" -gt 1 ]; then
            echo "::error::the stack plan does not read: D fails (the error is above)"
          fi
      - name: upload drift result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-review-drift-json
          path: mech-review-drift.json
          if-no-files-found: ignore
          overwrite: true
      - name: R2 guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ needs.stack.outputs.stack }}
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
          TEST_PATHS: ${{ inputs.test-paths }}
          PROTECTED_PATHS: ${{ inputs.protected-paths }}
        run: |
          set -uo pipefail
          # the project dir picks the plan entry whose adapter file judges (#17)
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK" --project-dir "$PROJECT_DIR")
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--protected-paths "$g"); fi
          done <<< "$PROTECTED_PATHS"
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" r2 "${args[@]}" > mech-review.json 2> mech-review.err || rc=$?
          cat mech-review.err >&2
          # exit 1 = fail entries: a result, saved and reported. exit 2+ = usage or git error: no result.
          if [ "$rc" -gt 1 ]; then
            rm -f mech-review.json
            echo "::error::mech-review engine exit $rc (usage or git error): no result"
            exit "$rc"
          fi
      - name: R0 static half (adapter proof)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ needs.stack.outputs.stack }}
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          set -uo pipefail
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK" --project-dir "$PROJECT_DIR")
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" r0 "${args[@]}" > mech-review-r0.json 2> mech-review-r0.err || rc=$?
          cat mech-review-r0.err >&2
          # git and adapter only, seconds; its result rides in the guard's artifact beside R2's. exit 1 = a fail entry
          # (adapter-fix, or needs-human for a loosened limit): a result, kept. exit 2+ = usage or git error: no result,
          # and the report fails R0 with a CI entry naming the job
          if [ "$rc" -gt 1 ] || [ ! -s mech-review-r0.json ]; then
            rm -f mech-review-r0.json
            echo "::error::mech-review r0 exit $rc: no R0 result"
            exit "$(( rc > 0 ? rc : 2 ))"
          fi
      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-review-json
          path: |
            mech-review.json
            mech-review-r0.json
          if-no-files-found: ignore
          overwrite: true

  red-first:
    name: mech-review red-first (R1, R4)
    needs: [stack]
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-latest","windows":"windows-latest"}')[needs.stack.outputs.target-os] }}
    # runs PR code (cargo test): read-only token, so a PR test cannot edit the comment or PR content
    permissions:
      contents: read
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ekit engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ekit
          persist-credentials: false
      - name: Rust toolchain
        if: needs.stack.outputs.stack == 'rust'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: Python toolchain
        if: needs.stack.outputs.stack == 'python'
        env:
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
        run: |
          set -eu
          # project-dir stays under the repo root; a value that escapes it is a hard stop, not a silent path
          case "$PROJECT_DIR" in /*|..|../*|*/..|*/../*) echo "::error::project-dir $PROJECT_DIR: want a dir under the repo root"; exit 2 ;; esac
          # runner python in a venv (the runner's system python is externally managed); pytest pinned; the requirements
          # files in the project dir install the test deps. The project itself is not installed here: setup-command does
          # that (it runs after this step, with the venv on PATH).
          python3 -m venv "$RUNNER_TEMP/py-venv"
          "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet "pytest==9.2.0"
          cd "$GITHUB_WORKSPACE/caller/$PROJECT_DIR"
          for f in requirements*.txt; do
            [ -e "$f" ] || continue
            "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet -r "$f"
          done
          echo "$RUNNER_TEMP/py-venv/bin" >> "$GITHUB_PATH"
      - name: TypeScript toolchain
        if: needs.stack.outputs.stack == 'ts'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: TypeScript dependencies
        # lockfile-aware: npm ci for package-lock.json, the repo's own pnpm or yarn (pinned) for theirs. The install runs
        # the dependencies' install scripts, like the test code does: the job's token is read-only. No lockfile is a stop.
        if: needs.stack.outputs.stack == 'ts'
        env:
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
        run: |
          set -eu
          # project-dir stays under the repo root; a value that escapes it is a hard stop, not a silent path
          case "$PROJECT_DIR" in /*|..|../*|*/..|*/../*) echo "::error::project-dir $PROJECT_DIR: want a dir under the repo root"; exit 2 ;; esac
          cd "$GITHUB_WORKSPACE/caller/$PROJECT_DIR"
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f pnpm-lock.yaml ]; then
            npx --yes pnpm@10.34.6 install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            npx --yes yarn@1.22.22 install --frozen-lockfile
          else
            echo "::error::no lockfile (package-lock.json, pnpm-lock.yaml or yarn.lock) in $PROJECT_DIR: the install must be reproducible"
            exit 2
          fi
      - name: extra apt packages
        if: runner.os == 'Linux' && inputs.extra-apt-packages != ''
        env:
          EXTRA_APT: ${{ inputs.extra-apt-packages }}
        run: |
          set -eu
          read -ra pkgs <<< "$EXTRA_APT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${pkgs[@]}"
      - name: setup command
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        shell: bash
        run: bash -c "$SETUP_COMMAND"
      - name: R0 runtime fingerprint (run)
        # #21: the key of a passed proof in the cache below. No key (an error here) only means the red step proves it
        id: r0fp
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ needs.stack.outputs.stack }}
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
        run: |
          set -uo pipefail
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" r0 --repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" \
            --head "$HEAD_SHA" --stack "$STACK" --project-dir "$PROJECT_DIR" --fingerprint run > r0-fingerprint.json || exit 0
          python3 -I - "$GITHUB_OUTPUT" <<'PY' || exit 0
          import json, sys
          key = json.load(open("r0-fingerprint.json"))["key"]
          with open(sys.argv[1], "a") as f:
              f.write(f"key={key}\n")
          PY
      - name: R0 runtime cache (run)
        # a hit skips the proof (the engine re-checks the file names its own fingerprint); a miss only re-runs it.
        # The engine writes the file only when the proof passes, so only a pass is ever saved
        if: steps.r0fp.outputs.key != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ekit-r0
          key: ${{ steps.r0fp.outputs.key }}
      - name: R1 red-first, R4 determinism
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          AGENT_PREFIX: ${{ inputs.agent-branch-prefix }}
          STACK: ${{ needs.stack.outputs.stack }}
          TEST_PATHS: ${{ inputs.test-paths }}
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
        run: |
          set -uo pipefail
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK"
                --head-branch "$HEAD_REF" --project-dir "$PROJECT_DIR")
          args+=(--r0 "$HOME/.cache/ekit-r0")  # R0's runtime half, run part (#21)
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--agent-prefix "$g"); fi
          done <<< "$AGENT_PREFIX"
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" red "${args[@]}" > mech-review-red.json 2> mech-review-red.err || rc=$?
          cat mech-review-red.err >&2
          # exit 1 = fail entries: a result, saved and reported. exit 2+ = usage or git error: no result.
          if [ "$rc" -gt 1 ]; then
            rm -f mech-review-red.json
            echo "::error::mech-review red-first exit $rc (usage or git error): no result"
            exit "$rc"
          fi
      - name: upload red-first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-review-red-json
          path: mech-review-red.json
          if-no-files-found: ignore
          overwrite: true

  plan:
    name: mech-review plan (R3 runs?)
    needs: [stack]
    runs-on: ubuntu-latest
    # git only, no PR code: the write token stays here, away from the jobs that run PR code (#46)
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ekit engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ekit
          persist-credentials: false
      - name: R3 plan (does the mutants job run)
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ needs.stack.outputs.stack }}
          TEST_PATHS: ${{ inputs.test-paths }}
        run: |
          set -eu
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK")
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" plan "${args[@]}" > mech-plan.json
          python3 -I - "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          p = json.load(open("mech-plan.json"))
          with open(sys.argv[1], "a") as out:
              out.write(f"run={str(p['run']).lower()}\n")
          PY

  baseline:
    name: mech-review baseline (R3, once)
    needs: [stack, plan]
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-latest","windows":"windows-latest"}')[needs.stack.outputs.target-os] }}
    # rust and python: runs PR code (the unmutated tests once, and the mutation tool's listing): read-only token, as the
    # other PR-code jobs. Sets the shard count and the per-mutant timeout the mutants shards use (#46).
    permissions:
      contents: read
    outputs:
      run: ${{ steps.baseline.outputs.run }}
      count: ${{ steps.baseline.outputs.count }}
      shards: ${{ steps.baseline.outputs.shards }}
      timeout: ${{ steps.baseline.outputs.timeout }}
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ekit engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ekit
          persist-credentials: false
      - name: Python toolchain
        if: needs.stack.outputs.stack == 'python'
        env:
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
        run: |
          set -eu
          case "$PROJECT_DIR" in /*|..|../*|*/..|*/../*) echo "::error::project-dir $PROJECT_DIR: want a dir under the repo root"; exit 2 ;; esac
          # the venv the mutants job uses: the baseline runs the suite once and mutmut's listing (#64)
          python3 -m venv "$RUNNER_TEMP/py-venv"
          "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet "pytest==9.2.0" "mutmut==3.8.1"
          cd "$GITHUB_WORKSPACE/caller/$PROJECT_DIR"
          for f in requirements*.txt; do
            [ -e "$f" ] || continue
            "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet -r "$f"
          done
          echo "$RUNNER_TEMP/py-venv/bin" >> "$GITHUB_PATH"
      - name: Rust toolchain
        if: needs.stack.outputs.stack == 'rust'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: extra apt packages
        if: runner.os == 'Linux' && (needs.stack.outputs.stack == 'rust' || needs.stack.outputs.stack == 'python') && inputs.extra-apt-packages != ''
        env:
          EXTRA_APT: ${{ inputs.extra-apt-packages }}
        run: |
          set -eu
          read -ra pkgs <<< "$EXTRA_APT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${pkgs[@]}"
      - name: setup command
        if: (needs.stack.outputs.stack == 'rust' || needs.stack.outputs.stack == 'python') && inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        shell: bash
        run: bash -c "$SETUP_COMMAND"
      - name: install cargo-mutants (pinned)
        # a failed install is not a stop: the engine reports n/a (env) when the tool is missing
        if: needs.stack.outputs.stack == 'rust'
        continue-on-error: true
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: R3 baseline (once; shard count, derived timeout)
        # rust: cargo-mutants' unmutated baseline. python: the whole suite once and mutmut's listing (#64). ts: the shard count from the changed files (git only).
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ needs.stack.outputs.stack }}
          TEST_PATHS: ${{ inputs.test-paths }}
          MUTATION_BUDGET: ${{ inputs.mutation-budget }}
          MAX_MUTANTS: ${{ inputs.max-mutants }}
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
        run: |
          set -uo pipefail
          # rust: the toolchain action exports CARGO_INCREMENTAL=0, so each mutant rebuilt the whole crate from scratch.
          # Incremental rebuilds, and no debug info (each mutant relinks every test binary): build time only, same tests.
          if [ "$STACK" = "rust" ]; then
            export CARGO_INCREMENTAL=1
            export CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0
          fi
          # the most shards: 4. rust: min(4, mutants under max-mutants, ceil(estimated minutes / (budget / 2))), the
          # estimate from the measured baseline (rust, python); ts: one per changed production file, at most 4 (#26, #64)
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK"
                --mutation-budget "$MUTATION_BUDGET" --max-mutants "$MAX_MUTANTS" --project-dir "$PROJECT_DIR" --shards 4)
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" baseline "${args[@]}" > mech-review-baseline.json 2> mech-review-baseline.err || rc=$?
          cat mech-review-baseline.err >&2
          # exit 0 = a result (a failed or timed-out baseline is a result too). exit 2+ = usage or git error: no result.
          if [ "$rc" -gt 1 ]; then
            rm -f mech-review-baseline.json
            echo "::error::mech-review baseline exit $rc (usage or git error): no result"
            exit "$rc"
          fi
          python3 -I - "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          b = json.load(open("mech-review-baseline.json"))
          with open(sys.argv[1], "a") as out:
              out.write(f"run={str(b['run']).lower()}\n")
              out.write(f"count={b['count']}\n")
              out.write(f"shards={json.dumps(list(range(b['count'])))}\n")
              out.write(f"timeout={'' if b['timeout'] is None else b['timeout']}\n")
          PY
      - name: upload baseline result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-review-baseline-json
          path: mech-review-baseline.json
          if-no-files-found: ignore
          overwrite: true

  mutants:
    name: mech-review mutants (R3 shard ${{ matrix.shard }})
    needs: [stack, plan, baseline]
    if: ${{ needs.baseline.outputs.run == 'true' }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-latest","macos":"macos-latest","windows":"windows-latest"}')[needs.stack.outputs.target-os] }}
    # runs PR code (cargo mutants runs its tests): read-only token, same as red-first
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.baseline.outputs.shards) }}
    steps:
      - name: caller checkout (full history, PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false
      - name: ekit engine checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ekit
          persist-credentials: false
      - name: Rust toolchain
        if: needs.stack.outputs.stack == 'rust'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: Python toolchain
        if: needs.stack.outputs.stack == 'python'
        env:
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
        run: |
          set -eu
          # project-dir stays under the repo root; a value that escapes it is a hard stop, not a silent path
          case "$PROJECT_DIR" in /*|..|../*|*/..|*/../*) echo "::error::project-dir $PROJECT_DIR: want a dir under the repo root"; exit 2 ;; esac
          # runner python in a venv (the runner's system python is externally managed); pytest and mutmut pinned; the
          # requirements files in the project dir install the test deps. The project itself is not installed here:
          # setup-command does that (it runs after this step, with the venv on PATH).
          python3 -m venv "$RUNNER_TEMP/py-venv"
          "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet "pytest==9.2.0" "mutmut==3.8.1"
          cd "$GITHUB_WORKSPACE/caller/$PROJECT_DIR"
          for f in requirements*.txt; do
            [ -e "$f" ] || continue
            "$RUNNER_TEMP/py-venv/bin/python" -m pip install --quiet -r "$f"
          done
          echo "$RUNNER_TEMP/py-venv/bin" >> "$GITHUB_PATH"
      - name: TypeScript toolchain
        if: needs.stack.outputs.stack == 'ts'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: TypeScript dependencies
        # lockfile-aware: npm ci for package-lock.json, the repo's own pnpm or yarn (pinned) for theirs. The install runs
        # the dependencies' install scripts, like the test code does: the job's token is read-only. No lockfile is a stop.
        if: needs.stack.outputs.stack == 'ts'
        env:
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
        run: |
          set -eu
          # project-dir stays under the repo root; a value that escapes it is a hard stop, not a silent path
          case "$PROJECT_DIR" in /*|..|../*|*/..|*/../*) echo "::error::project-dir $PROJECT_DIR: want a dir under the repo root"; exit 2 ;; esac
          cd "$GITHUB_WORKSPACE/caller/$PROJECT_DIR"
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f pnpm-lock.yaml ]; then
            npx --yes pnpm@10.34.6 install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            npx --yes yarn@1.22.22 install --frozen-lockfile
          else
            echo "::error::no lockfile (package-lock.json, pnpm-lock.yaml or yarn.lock) in $PROJECT_DIR: the install must be reproducible"
            exit 2
          fi
      - name: extra apt packages
        if: runner.os == 'Linux' && inputs.extra-apt-packages != ''
        env:
          EXTRA_APT: ${{ inputs.extra-apt-packages }}
        run: |
          set -eu
          read -ra pkgs <<< "$EXTRA_APT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${pkgs[@]}"
      - name: setup command
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        shell: bash
        run: bash -c "$SETUP_COMMAND"
      - name: Stryker (pinned)
        # isolated from the repo's node_modules: its own prefix in the runner temp dir. A failed install is not a stop:
        # the engine reports n/a (env) when the binary is missing. The test runner plugin is loaded from the project.
        if: needs.stack.outputs.stack == 'ts'
        continue-on-error: true
        run: |
          set -u
          npm install --prefix "$RUNNER_TEMP/stryker" --no-audit --no-fund --legacy-peer-deps "@stryker-mutator/core@10.0.0" "@stryker-mutator/jest-runner@10.0.0"
      - name: install cargo-mutants (pinned)
        # a failed install is not a stop: the engine reports n/a (env) when the tool is missing
        if: needs.stack.outputs.stack == 'rust'
        id: install
        continue-on-error: true
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: R0 runtime fingerprint (r3)
        # #21: shard 0 runs the R3 control; the key of a passed one in the cache below (no key: the shard proves it)
        if: matrix.shard == 0
        id: r0fp
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ needs.stack.outputs.stack }}
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
          STRYKER_BIN: ${{ runner.temp }}/stryker/node_modules/.bin/stryker
        run: |
          set -uo pipefail
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK" --project-dir "$PROJECT_DIR")
          if [ "$STACK" = "ts" ]; then args+=(--mutants-cmd "$STRYKER_BIN"); fi
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" r0 "${args[@]}" --fingerprint r3 > r0-fingerprint.json || exit 0
          python3 -I - "$GITHUB_OUTPUT" <<'PY' || exit 0
          import json, sys
          key = json.load(open("r0-fingerprint.json"))["key"]
          with open(sys.argv[1], "a") as f:
              f.write(f"key={key}\n")
          PY
      - name: R0 runtime cache (r3)
        if: matrix.shard == 0 && steps.r0fp.outputs.key != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ekit-r0
          key: ${{ steps.r0fp.outputs.key }}
      - name: R3 mutation on the diff (shard)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ needs.stack.outputs.stack }}
          TEST_PATHS: ${{ inputs.test-paths }}
          MUTATION_BUDGET: ${{ inputs.mutation-budget }}
          MUTANT_TIMEOUT: ${{ inputs.mutant-timeout || needs.baseline.outputs.timeout }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.baseline.outputs.count }}
          MAX_MUTANTS: ${{ inputs.max-mutants }}
          PROJECT_DIR: ${{ needs.stack.outputs.project-dir }}
          STRYKER_BIN: ${{ runner.temp }}/stryker/node_modules/.bin/stryker
        run: |
          set -uo pipefail
          # rust: the toolchain action exports CARGO_INCREMENTAL=0, so each mutant rebuilt the whole crate from scratch.
          # Incremental rebuilds, and no debug info (each mutant relinks every test binary): build time only, same tests.
          if [ "$STACK" = "rust" ]; then
            export CARGO_INCREMENTAL=1
            export CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0
          fi
          args=(--repo "$GITHUB_WORKSPACE/caller" --base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK"
                --shard "$SHARD/$SHARD_COUNT" --mutation-budget "$MUTATION_BUDGET" --max-mutants "$MAX_MUTANTS"
                --project-dir "$PROJECT_DIR")
          if [ -n "$MUTANT_TIMEOUT" ]; then args+=(--mutant-timeout "$MUTANT_TIMEOUT"); fi
          if [ "$STACK" = "ts" ]; then args+=(--mutants-cmd "$STRYKER_BIN"); fi
          if [ "$SHARD" = "0" ]; then args+=(--r0 "$HOME/.cache/ekit-r0"); fi  # R0's R3 control, shard 0 only (#21)
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--test-paths "$g"); fi
          done <<< "$TEST_PATHS"
          rc=0
          python3 -I "$GITHUB_WORKSPACE/ekit/scripts/mech-review.py" mutants "${args[@]}" > mech-review-mutants.json 2> mech-review-mutants.err || rc=$?
          cat mech-review-mutants.err >&2
          # exit 1 = fail entries: a result, saved and reported. exit 2+ = usage or git error: no result.
          if [ "$rc" -gt 1 ]; then
            rm -f mech-review-mutants.json
            echo "::error::mech-review mutants exit $rc (usage or git error): no result"
            exit "$rc"
          fi
      - name: upload mutants result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-review-mutants-${{ matrix.shard }}
          path: mech-review-mutants.json
          if-no-files-found: ignore
          overwrite: true

  report:
    name: mech-review report
    needs: [stack, guard, red-first, plan, baseline, mutants]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ekit comment poster checkout (the ref this workflow was called at)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ekit
          persist-credentials: false
      - name: fetch guard result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mech-review-json
          path: r2-result
      - name: fetch drift result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mech-review-drift-json
          path: drift-result
      - name: fetch red-first result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mech-review-red-json
          path: red-result
      - name: fetch baseline result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mech-review-baseline-json
          path: baseline-result
      - name: fetch mutants shard results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "mech-review-mutants-*"
          path: mutants-result
      - name: merge mutants (R3, baseline and shards)
        if: ${{ needs.stack.result == 'success' && (needs.plan.outputs.run == 'true' || needs.plan.result != 'success') }}
        env:
          COUNT: ${{ needs.baseline.outputs.count }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK: ${{ needs.stack.outputs.stack }}
        run: |
          set -u
          # no baseline result (its job crashed, or never ran): R3 fails with a CI entry; a missing shard file is one too
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --stack "$STACK" --shards "${COUNT:-0}")
          if [ -f baseline-result/mech-review-baseline.json ]; then
            args+=(--baseline baseline-result/mech-review-baseline.json)
          else
            args+=(--baseline-reason "no JSON from the baseline job (see its log)")
          fi
          for ((k = 0; k < ${COUNT:-0}; k++)); do
            f="mutants-result/mech-review-mutants-$k/mech-review-mutants.json"
            if [ -f "$f" ]; then args+=(--envelope "$k=$f"); fi
          done
          rc=0
          python3 -I ekit/scripts/mech-review.py merge "${args[@]}" > mutants-merged.json 2> mutants-merged.err || rc=$?
          cat mutants-merged.err >&2
          if [ "$rc" -gt 1 ]; then
            rm -f mutants-merged.json
            echo "::error::mech-review merge exit $rc (usage error): no mutants result"
          fi
      - name: post or edit the sticky comment, set the check result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ needs.plan.outputs.run }}
          PLAN_RESULT: ${{ needs.plan.result }}
          STACK_RESULT: ${{ needs.stack.result }}
          STACK_ERROR: ${{ needs.stack.outputs.error }}
        run: |
          # no stack: no check ran; the comment says why (the projects found and the inputs to set)
          if [ "$STACK_RESULT" != "success" ]; then
            python3 -I ekit/scripts/mech-comment.py --pr "$PR_NUMBER" --head "$HEAD_SHA" \
              --reason "${STACK_ERROR:-the stack job produced no stack (see its log)}"
            exit $?
          fi
          extra=()
          if [ "$RUN" = "true" ] || [ "$PLAN_RESULT" != "success" ]; then
            extra+=(--envelope mutants=mutants-merged.json)
          fi
          if [ -f drift-result/mech-review-drift.json ]; then
            extra+=(--envelope drift=drift-result/mech-review-drift.json)
          fi
          python3 -I ekit/scripts/mech-comment.py --pr "$PR_NUMBER" --head "$HEAD_SHA" \
            --envelope r2=r2-result/mech-review.json \
            --envelope r0=r2-result/mech-review-r0.json \
            --envelope red=red-result/mech-review-red.json \
            "${extra[@]}" \
            --reason "no JSON from the job (see its log)"