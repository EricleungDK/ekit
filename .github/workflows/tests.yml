name: tests

# ekit's own suite (the same gate release.yml runs) on every PR, so a test that only fails on GitHub's runner shows up here and
# not first in release.yml (v0.2.5's release run was the suite's first run on a runner).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Maven downloads (the Java reference tests, #22)
        # #109: keyed on the Java fixture poms, so the tests do not fetch every dependency on every run
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('tests/fixtures/**/pom.xml', 'tests/fixtures/**/pom.xml.r0') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: tests/run.sh
        run: bash tests/run.sh

  hooks-macos:
    # The hooks, the scenario runner and the cloud installer run on users' machines. macOS is where they differ:
    # bash 3.2, BSD tools, no `timeout`, no `ss`. The mech-review engine itself only ever runs on ubuntu runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: hook, runner and installer tests
        run: |
          rc=0
          for t in preflight session-start failure-match gate runner cloud-install py; do
            echo "$t.test.sh"
            bash "tests/$t.test.sh" || rc=1
          done
          exit $rc

  scenarios:
    # Every .ekit/scenarios scenario, the step ci-local runs (#115, #116), beside the suite. Red only when a scenario
    # FAILED (each named); one this runner cannot run is named in the log with the tool it lacks and does not make the
    # job red (--unrunnable-ok), so a missing tool alone never fails it. Which scenario needs which tool:
    # docs/mech-review-ci.md#developer-machine. About 8 minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tools the scenarios need (strace, unshare -n, uv with Python 3.9)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          # stack-plan/session-start runs the hook under `unshare -n`: as the runner's non-root user that needs a user
          # namespace, which ubuntu 24.04 keeps behind AppArmor; the shim maps the runner's own uid into it
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p "$RUNNER_TEMP/netns-bin"
          printf '#!/bin/sh\nexec /usr/bin/unshare --map-current-user "$@"\n' > "$RUNNER_TEMP/netns-bin/unshare"
          chmod +x "$RUNNER_TEMP/netns-bin/unshare"
          echo "$RUNNER_TEMP/netns-bin" >> "$GITHUB_PATH"
          # the old-python scenarios find uv's installed 3.9 offline
          pipx install uv==0.11.32
          uv python install 3.9
      - name: scenarios
        run: python3 -I scripts/ci-local.py --step scenarios --unrunnable-ok
