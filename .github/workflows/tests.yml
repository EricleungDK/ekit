name: tests

# ekit's own suite (the same gate release.yml runs) on every PR, so a test that only fails on GitHub's runner shows up here and
# not first in release.yml (v0.2.5's release run was the suite's first run on a runner).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tests/run.sh
        run: bash tests/run.sh

  hooks-macos:
    # The hooks, the scenario runner and the cloud installer run on users' machines. macOS is where they differ:
    # bash 3.2, BSD tools, no `timeout`, no `ss`. The mech-review engine itself only ever runs on ubuntu runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: hook, runner and installer tests
        run: |
          rc=0
          for t in preflight session-start failure-match gate runner cloud-install py; do
            echo "$t.test.sh"
            bash "tests/$t.test.sh" || rc=1
          done
          exit $rc
