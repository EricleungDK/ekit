name: mech-review (ekit self)

# ekit's own caller. Uses the LOCAL reusable workflow, so on a PR it runs the PR's engine (the demo path).
# Adopters call @v0 instead (each release moves it): see docs/mech-review-ci.md.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  mech-review:
    uses: ./.github/workflows/mech-review.yml
    with:
      # the engine and the hooks are python; their unit tests are tests/py (the *.test.sh files are smokes R1 cannot run)
      stack: python
      test-paths: 'tests/**'
      protected-paths: '.github/**'
